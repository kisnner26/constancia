<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ejemplo</title>
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<canvas id="c2" aria-hidden="true"></canvas>
<button id="snd" type="button" aria-label="sonido" aria-pressed="false" hidden>
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><g class="on"><path d="M15.5 9a4 4 0 0 1 0 6"/></g><g class="off"><path d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></g></svg>
</button>
<svg id="sin-webgl" hidden viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M12 3 22 20H2z"/></svg>
<script type="module">
  import { createPlayer } from './engine/player.js';
  import escena from './scenes/ejemplo.js';
  createPlayer({ scene: escena, canvas: document.querySelector('#c2'), glCanvas: document.querySelector('#gl'), soundButton: document.querySelector('#snd'), fallback: () => { document.querySelector('#sin-webgl').hidden = false; } });
</script>
